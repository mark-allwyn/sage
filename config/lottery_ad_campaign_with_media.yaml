survey:
  name: "Lottery Advertising Campaign Evaluation (with Media)"
  description: "Evaluate lottery advertising campaigns with visual creative elements"

  context: |
    We are testing new advertising creative for an upcoming lottery game launch.
    You will be shown advertising concepts and asked to evaluate their effectiveness.

    **NEW GAME: MILLIONAIRE MAKER SCRATCH CARDS**

    A new $20 premium scratch card with a guaranteed millionaire winner every month.

    Product Details:
    - Price: $20 per card (highest premium tier)
    - Monthly Guaranteed: At least one $1M winner per month
    - Top Prize Pool: $5M distributed monthly
    - Overall Odds: 1 in 2.8 cards wins
    - Minimum Prize: $20 (break even)
    - Second-Tier Prizes: $100K, $50K, $25K, $10K

    Campaign Theme: "Someone's Going to Win $1M This Month - Why Not You?"

  questions:
    # Ad Concept 1 with Image
    - id: "ad_concept_1_appeal"
      text: |
        Please view this advertising concept:

        [IMAGE: A luxurious lifestyle scene showing a person on a yacht with champagne, overlooking a sunset.
        Headline: "Someone's Becoming a Millionaire This Month"
        Subheading: "Millionaire Maker - Guaranteed $1M Winner Every Month"
        Call-to-action: "Play Now - $20"]

        How appealing is this advertisement to you?
      type: "likert_7"
      image_url: "https://example.com/lottery-ads/luxury-lifestyle-yacht.jpg"
      scale:
        1: "Not at all appealing"
        2: "Slightly unappealing"
        3: "Somewhat unappealing"
        4: "Neutral"
        5: "Somewhat appealing"
        6: "Appealing"
        7: "Extremely appealing"

    - id: "ad_concept_1_believability"
      text: "The guarantee of a millionaire winner every month seems believable"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    - id: "ad_concept_1_motivating"
      text: "This advertisement would motivate me to purchase the scratch card"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    # Ad Concept 2 with Image
    - id: "ad_concept_2_appeal"
      text: |
        Please view this alternative advertising concept:

        [IMAGE: A diverse group of real people holding oversized checks, smiling and celebrating.
        Headline: "Last Month's Winners - This Month Could Be You"
        Subheading: "Millionaire Maker - Join Our Winners' Circle"
        Call-to-action: "Buy Your $20 Card Today"
        Features actual winner photos and amounts won]

        How appealing is this advertisement to you?
      type: "likert_7"
      image_url: "https://example.com/lottery-ads/real-winners-celebration.jpg"
      scale:
        1: "Not at all appealing"
        2: "Slightly unappealing"
        3: "Somewhat unappealing"
        4: "Neutral"
        5: "Somewhat appealing"
        6: "Appealing"
        7: "Extremely appealing"

    - id: "ad_concept_2_trust"
      text: "Seeing real winners makes me trust this lottery game more"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    - id: "ad_concept_2_relatability"
      text: "I can relate to the people shown in this advertisement"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    # Card Design Preview with Image
    - id: "card_design_appeal"
      text: |
        Here is the actual scratch card design:

        [IMAGE: A premium-looking scratch card with gold and silver holographic elements.
        Large "$1,000,000" prominently displayed. Modern, clean design with security features visible.
        Three play areas: Main game, Multiplier bonus, and Lucky symbols section]

        How visually appealing is this scratch card design?
      type: "likert_7"
      image_url: "https://example.com/lottery-cards/millionaire-maker-design.jpg"
      scale:
        1: "Not at all appealing"
        2: "Slightly unappealing"
        3: "Somewhat unappealing"
        4: "Neutral"
        5: "Somewhat appealing"
        6: "Appealing"
        7: "Extremely appealing"

    - id: "card_premium_perception"
      text: "This scratch card looks like a premium, high-quality product"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    - id: "card_worth_price"
      text: "Based on the card design and game structure, $20 seems like a fair price"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    # Overall Product Evaluation
    - id: "overall_purchase_intent"
      text: "After seeing the advertising and card design, how likely are you to purchase this $20 scratch card?"
      type: "likert_5"
      scale:
        1: "Definitely would not buy"
        2: "Probably would not buy"
        3: "Might or might not buy"
        4: "Probably would buy"
        5: "Definitely would buy"

    - id: "monthly_guarantee_importance"
      text: "The monthly guaranteed millionaire winner is an important selling point"
      type: "likert_5"
      scale:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"

    # Ad Preference
    - id: "preferred_ad_concept"
      text: "Which advertising concept do you prefer?"
      type: "multiple_choice"
      options:
        - "Concept 1: Luxury lifestyle imagery"
        - "Concept 2: Real winners celebration"
        - "Both are equally appealing"
        - "Neither appeals to me"

    - id: "most_convincing_element"
      text: "What element would most convince you to try this scratch card?"
      type: "multiple_choice"
      options:
        - "Guaranteed $1M winner every month"
        - "Premium card design and quality"
        - "Good overall odds (1 in 2.8)"
        - "Minimum $20 prize (can't lose money)"
        - "Large prize pool ($5M monthly)"
        - "Real winner testimonials"
        - "Nothing would convince me"

    # Demographics and Usage
    - id: "current_scratch_card_spending"
      text: "How much do you typically spend on scratch cards per month?"
      type: "multiple_choice"
      options:
        - "$0 - I don't buy scratch cards"
        - "$1-$20 per month"
        - "$21-$50 per month"
        - "$51-$100 per month"
        - "Over $100 per month"

    - id: "price_point_comfort"
      text: "What is the most you would typically spend on a single scratch card?"
      type: "multiple_choice"
      options:
        - "$1-$2"
        - "$3-$5"
        - "$10"
        - "$20"
        - "$30 or more"
        - "I wouldn't buy scratch cards"

  demographics:
    - age_group
    - gender
    - income_level
    - persona_group

  persona_groups:
    - name: "Aspirational Dreamers"
      description: "Respond to luxury lifestyle imagery and big prize potential"
      weight: 0.25
      target_demographics:
        gender: ["Male", "Female"]
        age_group: ["25-34", "35-44", "45-54"]
        income_level: ["$25k-$50k", "$50k-$75k"]
      personas:
        - "A 31-year-old who dreams of a lifestyle change. Luxury imagery motivates them to play."
        - "A 44-year-old who watches luxury lifestyle content. Inspired by 'what if' scenarios."
        - "A 38-year-old who wants financial freedom. Premium products appeal to aspirational self-image."

    - name: "Skeptical Value Seekers"
      description: "Need proof and real winner stories to build trust"
      weight: 0.30
      target_demographics:
        gender: ["Male", "Female"]
        age_group: ["35-44", "45-54", "55-64"]
        income_level: ["$25k-$50k", "$50k-$75k"]
      personas:
        - "A 42-year-old who wants to see real winners before believing. Testimonials matter."
        - "A 51-year-old skeptical of marketing claims. Needs evidence of actual payouts."
        - "A 58-year-old who researches odds and reviews. Real winner stories provide credibility."

    - name: "Premium Players"
      description: "Already buy high-priced tickets, value quality and design"
      weight: 0.20
      target_demographics:
        gender: ["Male", "Female"]
        age_group: ["35-44", "45-54", "55-64"]
        income_level: ["$75k-$100k", "$100k+"]
      personas:
        - "A 46-year-old who only buys $10-$20 tickets. Appreciates premium design and presentation."
        - "A 53-year-old who values quality over quantity. Prefers fewer premium plays to many cheap ones."
        - "A 59-year-old collector who keeps interesting designs. Card aesthetics matter."

    - name: "Non-Players"
      description: "Don't play lottery, unlikely to be convinced"
      weight: 0.25
      target_demographics:
        gender: ["Male", "Female"]
        age_group: ["21-24", "25-34", "35-44"]
        income_level: ["Under $25k", "$25k-$50k"]
      personas:
        - "A 26-year-old who thinks lottery is a waste. No ad will change their mind."
        - "A 33-year-old focused on investing. Views lottery as poor use of money."
        - "A 40-year-old who doesn't gamble on principle. Against all forms of lottery."

  sample_size: 175
